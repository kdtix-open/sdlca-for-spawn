blank_issues_enabled: false
contact_links:
  - name: Ask a question or share an idea
    url: https://github.com/kdtix-open/sdlca-for-spawn/discussions
    about: Questions, open-ended ideas and show-and-tell belong in Discussions, where anyone can answer.
  - name: Report a security vulnerability privately
    url: https://github.com/kdtix-open/sdlca-for-spawn/security/advisories/new
    about: Please do not open a public issue for a vulnerability. See SECURITY.md.
  - name: Report a problem with Spawn itself
    url: https://www.spawn.co/support
    about: Bugs in Spawn (the platform, a world, a player or a message) go to Spawn's own channels; we cannot fix them here and do not speak for Spawn. Feedback you send to Spawn may become Spawn's under its terms.
  - name: Find out where to ask what
    url: https://github.com/kdtix-open/sdlca-for-spawn/blob/main/SUPPORT.md
    about: Which channel fits which kind of question, and how to reach the project about conduct or rights-holder matters.
  - name: Read the Code of Conduct
    url: https://github.com/kdtix-open/sdlca-for-spawn/blob/main/CODE_OF_CONDUCT.md
    about: We want everyone to feel welcome. This explains what that means here and how to report a problem.

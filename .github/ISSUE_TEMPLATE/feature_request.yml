name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement", "triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Open-ended or early ideas are very welcome in [Discussions](https://github.com/kdtix-open/sdlca-for-spawn/discussions/new?category=ideas); use this form when you can describe a concrete problem and a proposed change.
        Please keep in mind that this project follows Spawn's published rules for agents and tools; see [the rules we follow for Spawn](https://github.com/kdtix-open/sdlca-for-spawn/blob/main/docs/compliance/spawn-rules.md).
        Please do not paste tokens, invite codes, other people's messages, or any other session, join or login credential, including values printed by `spawn client join`.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Who runs into this, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
  - type: dropdown
    id: area
    attributes:
      label: Which part of the kit is this about?
      options:
        - Listener and handler (runtime)
        - Worlds and clones
        - Slack bridge (planned)
        - Agent providers and commands
        - Install and onboarding
        - Documentation
        - Something else
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help build it?
      description: We are glad to guide first-time contributors.
      options:
        - I would like to try, with some guidance
        - I could help with testing or documentation
        - I can build it myself
        - Not right now
    validations:
      required: true
  - type: dropdown
    id: ai-help
    attributes:
      label: Did an AI tool help write this request?
      description: "Choose Yes if this is true: An AI tool did more than spelling, formatting, autocomplete or a mechanical rename. Either answer is fine. Please tell us, and confirm you checked it yourself."
      options:
        - "No"
        - Yes, and I reviewed and edited it
        - Yes, but I have not reviewed it
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I have looked at the rules we follow for Spawn (linked at the top of this form), or I am not sure and would like help.
          required: true

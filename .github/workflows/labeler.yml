name: Label pull requests

# pull_request_target lets the labeler label pull requests from forks. It is safe here because this workflow
# never checks out or runs the pull request's code: it only reads the list of changed file names.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
